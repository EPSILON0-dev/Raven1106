image sdcard.img {
    hdimage {
	partition-table-type = "none"
    }

    partition env {
        image = "env.img"
        offset = 0x0
        size = 0x8000
    }

    partition idblock {
        image = "idblock.img"
        offset = 0x8000
        size = 512K
    }

    partition uboot {
        image = "uboot.img"
        offset = 0x88000
        size = 256K
    }

    partition boot {
        image = "boot.vfat"
        offset = 4M
        size = 64M
    }

    partition rootfs {
        image = "rootfs.ext4"
        offset = 68M
    }
}
